    <rect x="14" y="14" width="362" height="164" rx="8" fill="url(#screen)" opacity=".95"/>
    <path d="M30 142 C105 82 143 168 215 98 S311 92 358 42" fill="none" stroke="#fff" stroke-width="5" opacity=".78" filter="url(#glow)"/>
    <rect x="167" y="192" width="56" height="25" rx="5" fill="#64748b"/>
    <path d="M130 245h130l28 12H102z" fill="#94a3b8"/>
    <circle cx="350" cy="195" r="4" fill="#22d3ee"/>
  </g>
  <g fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif">
