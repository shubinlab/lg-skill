    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b9ba5"/><stop offset=".44" stop-color="#5164de"/><stop offset="1" stop-color="#df5eab"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#53e6e2"/><stop offset=".55" stop-color="#9d8cff"/><stop offset="1" stop-color="#ff7bbd"/></linearGradient>
