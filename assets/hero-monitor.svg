<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">LG Monitor Control Skill</title>
  <desc id="desc">A polished dark UI illustration showing a verified LG OLED monitor signal and its key capabilities.</desc>
  <defs>
