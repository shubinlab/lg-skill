<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">LG monitor control skill</title>
  <desc id="desc">Original vector illustration of a monitor with a verified 240Hz 10-bit signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="920" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="780" cy="36" r="100" fill="#22d3ee" opacity=".12"/>
  <circle cx="870" cy="260" r="140" fill="#f472b6" opacity=".11"/>
  <g transform="translate(44 43)">
